<!DOCTYPE html>
<html>
<head>
<title>SplitWiseX - Dashboard</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h2>SplitWiseX</h2>
        <p>Your expense dashboard</p>
    </div>

    <div class="card">
        <h3>Your Groups</h3>

        {% if split_group %}
            {% for g in split_group %}
            <div class="group">
                <a href="/group/{{ g[0] }}">
                    💸 {{ g[0] }}
                    <span style="float:right; color:#48dbfb;">
                        {{ g[1] }}
                    </span>
                </a>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">No groups yet. Add your first expense to get started.</div>
        {% endif %}
    </div>

    <div class="card actions">
        <a class="button add" href="/add_expense_ui">➕ Add Expense</a>
        <a class="button logout" href="/logout">Logout</a>
    </div>

</div>

</body>
</html>
