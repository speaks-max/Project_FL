<!DOCTYPE html>
<html>
<head>
<title>SplitWiseX – Split Expense</title>
<link rel="stylesheet" href="/static/css/add_expense.css">
</head>

<body>

<div class="page">

<div class="header">
    <div class="logo">SplitWiseX</div>
    <div class="tagline">Split smart. Settle instantly.</div>
</div>

<form method="POST" action="/add_expense_v2">

<div class="split-container">

<!-- LEFT -->
<div class="card">
    <h3>Expense Details</h3>

    <label>Group Name</label>
    <input name="group_name" placeholder="Trip, Dinner, Office Party" required>

    <label>Total Amount (₹)</label>
    <input type="number" name="amount" min="0.01" step="0.01" required>

    <label>Description</label>
    <input name="desc" placeholder="Hotel, Food, Travel…" required>

    <label>Paid By</label>
    <select name="paid_by">
        {% for uid, name in users %}
        <option value="{{uid}}">{{name}}</option>
        {% endfor %}
    </select>
</div>

<!-- RIGHT -->
<div class="card">
    <h3>Select Members</h3>

    <input type="text" class="search-box" placeholder="Search members..." onkeyup="filterMembers(this.value)">

    <div class="member-list" id="memberList">
        {% for uid, name in users %}
        <div class="member-row" data-id="{{uid}}" onclick="addMember('{{uid}}','{{name}}')">
            {{name}}
        </div>
        {% endfor %}
    </div>

    <div class="selected" id="selectedMembers"></div>
</div>

</div>

<button type="submit">Split Expense</button>

</form>

<script src="/static/js/add_expense.js"></script>
</body>
</html>
